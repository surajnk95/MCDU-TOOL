name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in ~15s locally. A CI runner has fewer cores and the OCR
    # tests spawn tesseract heavily, so allow headroom — but fail fast rather
    # than letting a deadlock burn the default six-hour budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The OCR pipeline shells out to the tesseract binary; app.py discovers it
      # on PATH. Without it the regression harness cannot run at all.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-timeout

      # -v names each test as it starts, so a hang is identifiable from the log
      # rather than a silent stall. pytest-timeout kills a stuck test and prints
      # its stack instead of letting the job sit until the job timeout.
      - name: Run tests
        run: python -m pytest tests/ -v --timeout=180 --timeout-method=thread
        env:
          PYTHONFAULTHANDLER: "1"
